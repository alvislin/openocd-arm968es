# OpenOCD Configuration for ARM968E-S via CMSIS-DAP (JTAG mode)

# 1. 介面驅動設定
adapter driver cmsis-dap
transport select jtag

# 2. JTAG 時脈設定
# ARM968E-S 開機時脈如果較慢，建議先給 200kHz
adapter speed 200

# 3. 定義 JTAG TAP 節點
# 預設 ARM968E-S TAP ID 範例：0x05968093 或 0x15968093 (若晶片廠商自訂 ID，可自行修改或加入 -ignore-version)
jtag newtap arm968 cpu -irlen 4 -ircapture 0x1 -irmask 0x0f

# 4. 建立 Target (ARM968E-S 使用 arm966e 驅動處理 EmbeddedICE)
target create arm968.cpu arm966e -endian little -chain-position arm968.cpu

# 5. Reset 組態設定 (若有接 nTRST 與 nSRST 可改為 trst_and_srst)
# reset_config trst_and_srst

# 若沒有接硬體 Reset 腳位，請使用下面這行：
reset_config none
